services:
  db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ${DB_VOLUME_NAME}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://postgres:password@db:5432/dailyflow
    container_name: ${APP_CONTAINER_NAME}
    ports:
      - ${APP_PORT}:${APP_PORT}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dailyflow
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node dist/src/main"

volumes:
  dailyflow_pgdata:
